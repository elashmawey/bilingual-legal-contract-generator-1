<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilingual Legal Contract Generator | منشئ العقود القانونية</title>
  <meta name="description" content="An application that acts as a senior legal counsel to generate precise, legally sound bilingual (Arabic-English) contracts based on Egyptian law. It gathers contract details from the user and then generates a formal contract.">
  <meta property="og:title" content="Bilingual Legal Contract Generator | منشئ العقود القانونية">
  <meta property="og:description" content="An application that acts as a senior legal counsel to generate precise, legally sound bilingual (Arabic-English) contracts based on Egyptian law.">
  
  <!-- PWA & Mobile Web App Capabilities -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="عقود المحامين">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg">

  <style>
    @import "tailwindcss";
    @import "@fortawesome/fontawesome-free/css/all.min.css";
    
    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    }
    
    .font-amiri {
      font-family: 'Amiri', 'Noto Naskh Arabic', serif;
    }

    .font-cinzel {
      font-family: 'Cinzel', Georgia, serif;
    }

    /* Print & PDF Optimization for Certified Legal Documents */
    @media print {
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
        font-size: 10.5pt !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      header, footer, .print\:hidden, nav, button, input {
        display: none !important;
      }
      .contract-paper {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
        max-width: 100% !important;
      }
      .clause-card {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        margin-bottom: 14pt !important;
      }
      .page-break-before {
        page-break-before: always !important;
      }
      .avoid-break {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      @page {
        size: A4 portrait;
        margin: 15mm 12mm 15mm 12mm;
      }
    }

    /* === Anti-Copy / Source Protection === */
    .no-select {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    
    /* Invisible watermark layer on printed/exported contracts */
    .contract-watermark::after {
      content: 'AdalaContracts — منشئ العقود القانونية المعتمد — جمهورية مصر العربية';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-35deg);
      font-size: 56px;
      color: rgba(30, 58, 138, 0.035);
      pointer-events: none;
      z-index: 0;
      white-space: nowrap;
      font-weight: 900;
    }
  </style>
  <script>
    // === Client-Side Anti-Theft Protections ===
    // Block right-click context menu
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    // Block keyboard shortcuts for viewing source / DevTools / saving
    document.addEventListener('keydown', function(e) {
      // Ctrl+U (View Source)
      if (e.ctrlKey && e.key === 'u') { e.preventDefault(); }
      // Ctrl+S (Save Page)
      if (e.ctrlKey && e.key === 's') { e.preventDefault(); }
      // Ctrl+Shift+I (DevTools)
      if (e.ctrlKey && e.shiftKey && e.key === 'I') { e.preventDefault(); }
      // F12 (DevTools)
      if (e.key === 'F12') { e.preventDefault(); }
      // Ctrl+Shift+J (Console)
      if (e.ctrlKey && e.shiftKey && e.key === 'J') { e.preventDefault(); }
      // Ctrl+Shift+C (Inspect Element)
      if (e.ctrlKey && e.shiftKey && e.key === 'C') { e.preventDefault(); }
    });
  </script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    // Register Service Worker for Offline Execution on All Devices
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').then(function(registration) {
          console.log('[PWA] ServiceWorker registered with scope:', registration.scope);
        }).catch(function(err) {
          console.warn('[PWA] ServiceWorker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
